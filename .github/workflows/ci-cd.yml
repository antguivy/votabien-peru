name: CI/CD Pipeline

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ========================================================
  # STAGE 1: Quality Gate (Lint, Type-check, Unit Tests)
  # ========================================================
  quality-check:
    name: Quality Check & Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Type Check
        run: pnpm run type-check || echo "No type-check script found"

      - name: Run Unit & Action Tests
        run: pnpm run test:unit

      # En PRs probamos la compilación para evitar romper main.
      # En main se omite porque la compilación real se realiza dentro de Docker en la siguiente fase.
      - name: Verify Next.js Build (PR Only)
        if: github.event_name == 'pull_request'
        run: pnpm run build
        env:
          NEXT_PUBLIC_ENVIRONMENT: "staging"

  # ========================================================
  # STAGE 2: Build & Push Docker Image to GHCR
  # ========================================================
  build-and-publish:
    name: Build & Publish to GHCR
    needs: [quality-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.docker_build.outputs.digest }}
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/antguivy/votabien-peru
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.votabienperu.com
            NEXT_PUBLIC_APP_DOMAIN=https://votabienperu.com
            NEXT_PUBLIC_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # STAGE 3: Deploy to Dokploy & Post-Deploy Health Check
  # ========================================================
  deploy:
    name: Deploy to Dokploy
    needs: [build-and-publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Deployment Webhook
        id: trigger_deploy
        if: env.DOKPLOY_WEBHOOK_URL != ''
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          echo "Dispatched deployment trigger to Dokploy..."
          curl -s -X POST "$DOKPLOY_WEBHOOK_URL" || true
          echo "Waiting 25 seconds for container pull and startup..."
          sleep 25
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://votabienperu.com || true)
          echo "Health check response code: $HTTP_STATUS"

      - name: Generate Pipeline Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 VotaBien Perú - CI/CD Pipeline Summary

          | Metric | Value |
          | :--- | :--- |
          | **Repository** | \`antguivy/votabien-peru\` |
          | **Commit** | \`${{ github.sha }}\` (\`${{ needs.build-and-publish.outputs.sha_short }}\`) |
          | **Docker Registry** | \`ghcr.io\` |
          | **Image** | \`ghcr.io/antguivy/votabien-peru:latest\` |
          | **Immutable Tag** | \`ghcr.io/antguivy/votabien-peru:sha-${{ needs.build-and-publish.outputs.sha_short }}\` |
          | **Quality Gate** | ✅ Passed (Lint, Type-check, Unit Tests) |
          | **Docker Build** | ✅ Published to GHCR |
          | **Dokploy Trigger** | ✅ Dispatched |
          EOF
